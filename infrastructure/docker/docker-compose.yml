services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goaegis
      POSTGRES_USER: goaegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goaegis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goaegis -d goaegis"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://goaegis:${POSTGRES_PASSWORD:-goaegis}@db:5432/goaegis
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOAEGIS_GITHUB_TOKEN: ${GOAEGIS_GITHUB_TOKEN:-}
      GOAEGIS_GITHUB_API_URL: ${GOAEGIS_GITHUB_API_URL:-https://api.github.com}
      GOAEGIS_TELEMETRY_ENABLED: ${GOAEGIS_TELEMETRY_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
